<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FiveM Norge Launcher</title>
<meta name="description" content="Alle norske FiveM-servere i én launcher. Kø når serveren er full, varsler, spilletid og FiveM-status. Gratis for Windows.">
<meta property="og:title" content="FiveM Norge Launcher">
<meta property="og:description" content="Alle norske FiveM-servere. Ett klikk unna.">
<meta name="theme-color" content="#07090E">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 16'%3E%3Crect width='22' height='16' rx='3' fill='%23D92B43'/%3E%3Crect x='6' width='4' height='16' fill='%23fff'/%3E%3Crect y='6' width='22' height='4' fill='%23fff'/%3E%3Crect x='7' width='2' height='16' fill='%231C3E8C'/%3E%3Crect y='7' width='22' height='2' fill='%231C3E8C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090E}
a{color:#C3CADB;text-decoration:none}a:hover{color:#FFFFFF}
button{font:inherit;cursor:pointer}
.btn-primary{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:16px;background:#D92B43;color:#FFFFFF;font-weight:600;font-size:16px}
.btn-primary:hover{background:#E83A52;color:#FFFFFF}
.btn-ghost{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px;border-radius:16px;border:1px solid #2A3348;color:#EEF1F7;font-weight:600;font-size:16px}
.btn-ghost:hover{border-color:#4A5674;color:#FFFFFF}
.navlink{font-size:15px;font-weight:500;color:#A7B0C5;padding:10px 4px}
.navlink:hover{color:#EEF1F7}
.tab{height:40px;padding:0 16px;border-radius:10px;border:0;background:transparent;color:#A7B0C5;font-size:14px;font-weight:600}
.tab:hover{color:#EEF1F7}
.tab-on{background:#1A2132;color:#EEF1F7}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:0 24px;border:0;background:transparent;color:#EEF1F7;font-size:17px;font-weight:600;text-align:left}
.faq-q:hover{background:#121725}
.card:hover{border-color:#2A3348}
</style>
<style>html{scroll-behavior:smooth}:focus-visible{outline:2px solid #FF8F9B;outline-offset:2px}@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: #07090E; color: #EEF1F7; font-family: 'Geist', system-ui, sans-serif; overflow: hidden">

  <header style="position: relative; z-index: 3; border-bottom: 1px solid #141926; background: rgba(7,9,14,.85)">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <a href="#top" style="display: flex; align-items: center; gap: 12px; color: #EEF1F7; font-weight: 700; font-size: 17px; letter-spacing: -0.01em">
        <svg width="28" height="20" viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" rx="3" fill="#D92B43"></rect><rect x="6" width="4" height="16" fill="#fff"></rect><rect y="6" width="22" height="4" fill="#fff"></rect><rect x="7" width="2" height="16" fill="#1C3E8C"></rect><rect y="7" width="22" height="2" fill="#1C3E8C"></rect></svg>
        FiveM Norge
      </a>
      <nav aria-label="Hovedmeny" style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
        <a class="navlink" href="#funksjoner">Funksjoner</a>
        <a class="navlink" href="#status">Status</a>
        <a class="navlink" href="#faq">Spørsmål</a>
        <a href="#status" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{ st.line }}; background: {{ st.bg }}; color: {{ st.fg }}; font-size: 13px; font-weight: 600">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ st.fg }}"></span>
          FiveM: {{ st.short }}
        </a>
        <a href="#last-ned" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; background: #EEF1F7; color: #07090E; font-weight: 600; font-size: 15px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
          Last ned
        </a>
      </nav>
    </div>
  </header>

  <section id="top" style="position: relative; padding: 96px 24px 0">
    <svg viewBox="0 0 1440 520" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 70%">
      <path d="M0 360 L160 250 L270 305 L420 140 L540 225 L680 80 L810 205 L930 150 L1090 270 L1230 190 L1440 260 L1440 520 L0 520Z" fill="#0D1325"></path>
      <path d="M0 420 L130 350 L290 395 L440 285 L600 365 L760 265 L900 345 L1060 245 L1220 330 L1440 290 L1440 520 L0 520Z" fill="#111931"></path>
      <path d="M0 360 L160 250 L270 305 L420 140 L540 225 L680 80 L810 205 L930 150 L1090 270 L1230 190 L1440 260" fill="none" stroke="#24305A" stroke-width="1.5"></path>
      <path d="M680 80 L656 100 L680 93 L704 102Z" fill="#DDE4F5" opacity="0.45"></path>
      <path d="M420 140 L400 156 L420 151 L439 158Z" fill="#DDE4F5" opacity="0.35"></path>
    </svg>

    <div style="position: relative; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 26px">
      <a href="#nytt" style="display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px 0 16px; border-radius: 999px; border: 1px solid #2A3348; background: rgba(15,19,29,.75); font-size: 14px; color: #C3CADB">
        Versjon 1.4 – kunngjøringer og verifiserte servere
        <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; background: #1A2132; color: #EEF1F7; font-size: 13px; font-weight: 600">Se hva som er nytt</span>
      </a>
      <h1 style="margin: 0; max-width: 940px; font-size: clamp(42px, 6.6vw, 84px); line-height: 1.0; font-weight: 800; letter-spacing: -0.05em">
        Alle norske FiveM-servere.<br><span style="color: #FF8F9B">Ett klikk unna.</span>
      </h1>
      <p style="margin: 0; max-width: 640px; font-size: 19px; line-height: 1.6; color: #A7B0C5">
        Finn serveren, se når det er mest folk, og koble til direkte. Er den full, står launcheren i kø for deg – også når den ligger i bakgrunnen.
      </p>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center">
        <a class="btn-primary" href="https://github.com/tommykarl/fivem-norge-launcher/releases/latest">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5l7.5-1v7H3zM11.5 4.4L21 3v8.5h-9.5zM3 12.5h7.5v7L3 18.5zM11.5 12.5H21V21l-9.5-1.4z"></path></svg>
          Last ned for Windows
        </a>
        <a class="btn-ghost" href="#funksjoner">Se funksjonene</a>
      </div>
      <div style="display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: #7F8AA3">
        <span>Versjon 1.4.0</span><span aria-hidden="true">·</span><span>Windows 10 og 11</span><span aria-hidden="true">·</span><span>Oppdaterer seg selv</span>
      </div>

      <div style="width: 100%; max-width: 1100px; margin-top: 30px; text-align: left">
        <div role="tablist" aria-label="Forhåndsvisning" style="display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: #0F131D; border: 1px solid #1E2535; margin-bottom: 14px">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <button role="tab" aria-selected="{{ t.sel }}" class="{{ t.cls }}" onClick="{{ t.pick }}">{{ t.label }}</button>
          </sc-for>
        </div>

        <div style="border-radius: 20px 20px 0 0; border: 1px solid #222A3E; border-bottom: 0; background: #07090E; box-shadow: 0 40px 120px rgba(0,0,0,.6); overflow: hidden">
          <div style="height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #141926; font-size: 12px; font-weight: 600; color: #A7B0C5">
            <span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="12" viewBox="0 0 22 16" aria-hidden="true"><rect width="22" height="16" rx="3" fill="#D92B43"></rect><rect x="6" width="4" height="16" fill="#fff"></rect><rect y="6" width="22" height="4" fill="#fff"></rect><rect x="7" width="2" height="16" fill="#1C3E8C"></rect><rect y="7" width="22" height="2" fill="#1C3E8C"></rect></svg>FiveM Norge</span>
            <span style="display: flex; gap: 8px" aria-hidden="true"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2A3348"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #2A3348"></span><span style="width: 10px; height: 10px; border-radius: 50%; background: #2A3348"></span></span>
          </div>
          <div style="display: flex; flex-wrap: wrap; min-height: 420px">
            <div style="flex: 1 1 180px; max-width: 210px; padding: 16px 12px; border-right: 1px solid #141926; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #A7B0C5">
              <sc-for list="{{ sideNav }}" as="n" hint-placeholder-count="4">
                <div style="height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-radius: 10px; background: {{ n.bg }}; color: {{ n.fg }}">{{ n.label }}<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #7F8AA3">{{ n.count }}</span></div>
              </sc-for>
              <div style="margin-top: 10px; border: 1px solid #1E2535; border-radius: 12px; padding: 12px">
                <div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7F8AA3">Live i Norge</div>
                <div style="margin-top: 6px; font-size: 22px; font-weight: 700; color: #EEF1F7">157</div>
                <div style="font-size: 12px">spillere</div>
              </div>
              <div style="margin-top: 8px; border: 1px solid #1E2535; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center">
                <span style="width: 9px; height: 9px; border-radius: 50%; background: {{ st.fg }}"></span>
                <div><div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #7F8AA3">FiveM-status</div><div style="font-size: 12px; font-weight: 600; color: #EEF1F7">{{ st.short }}</div></div>
              </div>
            </div>

            <div style="flex: 999 1 460px; min-width: 0; padding: 20px 22px 22px">
              <sc-if value="{{ tabHome }}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; flex-direction: column; gap: 14px">
                  <div><div style="font-size: 13px; color: #A7B0C5">God kveld,</div><div style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">snowblaze_</div></div>
                  <div style="position: relative; overflow: hidden; border-radius: 16px; background: #10162A; border: 1px solid #1E2740; padding: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
                    <div style="width: 48px; height: 48px; border-radius: 14px; background: #8A6A12; display: grid; place-items: center; font-weight: 700; font-size: 20px">L</div>
                    <div style="flex: 1; min-width: 160px"><div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #FF8F9B">Fortsett der du slapp</div><div style="font-size: 18px; font-weight: 700">Legacyrp.no</div><div style="font-size: 12px; color: #C3CADB">46 / 200 online nå</div></div>
                    <div style="height: 38px; padding: 0 16px; border-radius: 11px; background: #D92B43; color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center">Spill igjen</div>
                  </div>
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
                    <div style="background: #0F131D; border: 1px solid #1A2030; border-radius: 14px; padding: 14px">
                      <div style="font-size: 13px; font-weight: 600">Denne uka</div>
                      <div style="font-size: 20px; font-weight: 700; margin: 4px 0 10px">7 t 18 min</div>
                      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; height: 60px; align-items: end">
                        <sc-for list="{{ week }}" as="w" hint-placeholder-count="7">
                          <div style="height: {{ w.h }}%; border-radius: 4px 4px 1px 1px; background: {{ w.c }}"></div>
                        </sc-for>
                      </div>
                    </div>
                    <div style="background: #0F131D; border: 1px solid #1A2030; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
                      <div style="font-size: 13px; font-weight: 600">Varsler og kø</div>
                      <div style="display: flex; align-items: center; gap: 10px"><div style="width: 30px; height: 30px; border-radius: 9px; background: #3F6A1F; display: grid; place-items: center; font-weight: 700; font-size: 13px">R</div><div style="flex: 1; font-size: 13px"><div style="font-weight: 600">RIKET ROLLESPILL</div><div style="font-size: 11px; color: #FFC24B">I kø · 8 / 8</div></div></div>
                      <div style="display: flex; align-items: center; gap: 10px"><div style="width: 30px; height: 30px; border-radius: 9px; background: #2B4A8F; display: grid; place-items: center; font-weight: 700; font-size: 13px">S</div><div style="flex: 1; font-size: 13px"><div style="font-weight: 600">Sequel RP</div><div style="font-size: 11px; color: #A7B0C5">Over 50 spillere</div></div></div>
                    </div>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{ tabServers }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 12px">
                  <div style="height: 40px; border-radius: 12px; background: #0F131D; border: 1px solid #1E2535; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; color: #7F8AA3">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
                    Søk etter servere, tags eller ID
                    <span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #2A3348; border-radius: 6px; padding: 1px 6px">Ctrl K</span>
                  </div>
                  <div style="border: 1px solid #161C2A; border-radius: 14px; overflow: hidden; background: #0B0E16">
                    <sc-for list="{{ preview }}" as="s" hint-placeholder-count="4">
                      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid #131826">
                        <div style="width: 36px; height: 36px; border-radius: 10px; background: {{ s.color }}; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex-shrink: 0">{{ s.letter }}</div>
                        <div style="flex: 1; min-width: 0">
                          <div style="display: flex; gap: 6px; align-items: center"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span>
                            <sc-if value="{{ s.mine }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #FF8F9B; border: 1px solid rgba(217,43,67,.45); background: rgba(217,43,67,.1); border-radius: 999px; padding: 0 7px">{{ s.mine }}</span></sc-if>
                          </div>
                          <div style="margin-top: 6px; height: 5px; border-radius: 5px; background: #1A2030; max-width: 200px"><div style="height: 5px; border-radius: 5px; width: {{ s.pct }}%; background: {{ s.bar }}"></div></div>
                        </div>
                        <div style="font-size: 13px; font-weight: 600; width: 60px; text-align: right">{{ s.count }}</div>
                        <div style="height: 30px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; font-size: 12px; font-weight: 600; background: {{ s.btnBg }}; color: {{ s.btnFg }}; border: 1px solid {{ s.btnLine }}">{{ s.btn }}</div>
                      </div>
                    </sc-for>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{ tabStatus }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 12px">
                  <div style="border-radius: 16px; background: #10162A; border: 1px solid #1E2740; padding: 18px; display: flex; align-items: center; gap: 14px">
                    <div style="width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: {{ st.bg }}; color: {{ st.fg }}">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ st.icon }}"></path></svg>
                    </div>
                    <div><div style="font-size: 17px; font-weight: 700">{{ st.label }}</div><div style="font-size: 12px; color: #A7B0C5">Kilde: Rockstar Support + målinger fra din PC</div></div>
                  </div>
                  <div style="border: 1px solid #1A2030; border-radius: 14px; background: #0B0E16; overflow: hidden">
                    <sc-for list="{{ st.rows }}" as="r" hint-placeholder-count="5">
                      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #131826; font-size: 13px">
                        <span style="flex: 1">{{ r.name }}</span>
                        <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 600; color: {{ r.fg }}; background: {{ r.bg }}; border: 1px solid {{ r.line }}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{ r.fg }}"></span>{{ r.label }}</span>
                      </div>
                    </sc-for>
                  </div>
                </div>
              </sc-if>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section style="position: relative; z-index: 1; background: #07090E; border-top: 1px solid #1A2030">
    <div style="max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px">
      <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4">
        <div style="display: flex; gap: 14px; align-items: center">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #121725; border: 1px solid #1E2535; display: grid; place-items: center; color: #FF8F9B; flex-shrink: 0">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ f.icon }}"></path></svg>
          </div>
          <div><div style="font-size: 15px; font-weight: 600">{{ f.title }}</div><div style="font-size: 13px; color: #A7B0C5">{{ f.text }}</div></div>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="funksjoner" style="padding: 112px 24px">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
        <div style="max-width: 640px">
          <div style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #FF8F9B">Funksjoner</div>
          <h2 style="margin: 14px 0 0; font-size: clamp(32px, 4vw, 50px); line-height: 1.06; font-weight: 700; letter-spacing: -0.04em">Alt du trenger før du trykker «Spill»</h2>
        </div>
        <p style="margin: 0; max-width: 380px; font-size: 16px; line-height: 1.6; color: #A7B0C5">Bygget for norske rollespillservere – med kø, varsler og statistikk som FiveM sin egen liste mangler.</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">

        <article class="card" style="grid-column: 1 / -1; min-width: 0; position: relative; overflow: hidden; background: #10162A; border: 1px solid #1E2740; border-radius: 24px; padding: 32px; display: flex; gap: 32px; flex-wrap: wrap; align-items: center">
          <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
            <div style="font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #FFC24B">Kø og varsler</div>
            <h3 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em">Full server? Launcheren venter for deg.</h3>
            <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C3CADB">Trykk «Vent» på én eller flere servere. Den første som får plass vinner – resten fjernes fra køen. Få også varsel når en server kommer online igjen eller passerer et antall spillere.</p>
          </div>
          <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
            <div style="background: #07090E; border: 1px solid #222A3E; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
              <div style="width: 40px; height: 40px; border-radius: 12px; background: #3F6A1F; display: grid; place-items: center; font-weight: 700">R</div>
              <div style="flex: 1"><div style="font-size: 15px; font-weight: 600">RIKET ROLLESPILL</div><div style="font-size: 13px; color: #FF8F9B; font-weight: 600">8 / 8 · Full</div></div>
              <div style="height: 34px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #FFC24B; border: 1px solid rgba(255,194,75,.4); background: rgba(255,194,75,.12)">I kø</div>
