<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorittserver</title>
  <style>
    body { margin: 0; padding: 12px; color: #eee; background: #2d2d2d; font: 13px system-ui, sans-serif; }
    label { display: block; margin-bottom: 7px; }
    select { width: 100%; padding: 7px; color: #eee; background: #1e1e1e; border: 1px solid #555; border-radius: 4px; }
    button { margin-top: 8px; padding: 7px 10px; color: #eee; background: #444; border: 1px solid #666; border-radius: 4px; cursor: pointer; }
    button.primary { width: 100%; color: white; background: #d92846; border: 0; font-weight: 700; }
    #code { margin: 14px 0 10px; padding: 17px 8px; border: 1px dashed #526078; border-radius: 8px; background: #17191f; text-align: center; font: 700 27px ui-monospace, monospace; letter-spacing: 5px; }
    #hint { margin-top: 8px; color: #bbb; line-height: 1.5; }
    #auth[hidden] { display: none; }
  </style>
</head>
<body>
  <section id="auth" hidden>
    <strong>Logg inn med kode</strong>
    <div id="code"></div>
    <button id="approve" class="primary" type="button">Åpne Min side og godkjenn</button>
  </section>
  <label for="favorite">Favorittserver</label>
  <select id="favorite"><option value="">Laster favoritter …</option></select>
  <button id="reload" type="button">Last inn på nytt</button>
  <div id="hint">Start FiveM Norge Launcher for å laste favorittene.</div>
  <script>
    const select = document.querySelector('#favorite');
    const hint = document.querySelector('#hint');
    const auth = document.querySelector('#auth');
    const codeLabel = document.querySelector('#code');
    const approve = document.querySelector('#approve');
    let ws, context, action, savedServerId = '', loadId = 0, approveUrl = '';
    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function api(path, options = {}) {
      const response = await fetch(`http://127.0.0.1:53135${path}`, {
        ...options,
        headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        signal: AbortSignal.timeout(5000),
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
      return body;
    }
    const persist = () => {
      if (ws?.readyState === WebSocket.OPEN && context) {
        ws.send(JSON.stringify({ action, context, event: 'sendToPlugin', payload: { serverId: select.value } }));
      }
    };
    select.addEventListener('change', persist);
    approve.addEventListener('click', () => {
      if (ws?.readyState === WebSocket.OPEN && approveUrl) {
        ws.send(JSON.stringify({ event: 'openUrl', payload: { url: approveUrl } }));
      }
    });
    document.querySelector('#reload').addEventListener('click', loadFavorites);

    function failed(message) {
      auth.hidden = true;
      select.replaceChildren(new Option('Kan ikke hente favoritter', ''));
      hint.textContent = message;
    }

    async function startCodeLogin(id) {
      auth.hidden = false;
      select.replaceChildren(new Option('Venter på innlogging …', ''));
      hint.textContent = 'Lager en innloggingskode …';
      try {
        const login = await api('/auth/code/start', { method: 'POST', body: '{}' });
        if (id !== loadId) return;
        codeLabel.textContent = login.code;
        approveUrl = login.url;
        hint.textContent = 'Åpne Min side, logg inn med Discord og godkjenn koden. Koden gjelder i 10 minutter.';
        const until = Date.now() + Number(login.expiresIn || 600) * 1000;
        while (Date.now() < until && id === loadId) {
          await delay(2500);
          if (id !== loadId) return;
          const result = await api('/auth/code/poll', { method: 'POST', body: JSON.stringify({ poll: login.poll }) });
          if (!result.pending) {
            auth.hidden = true;
            await loadFavorites();
            return;
          }
        }
        if (id === loadId) hint.textContent = 'Koden er utløpt. Trykk «Last inn på nytt» for å lage en ny.';
      } catch (error) {
        if (id === loadId) hint.textContent = `${error.message}. Start launcheren og trykk «Last inn på nytt».`;
      }
    }

    async function loadFavorites() {
      const id = ++loadId;
      approveUrl = '';
      auth.hidden = true;
      select.replaceChildren(new Option('Kobler til launcheren …', ''));
      hint.textContent = 'Kontrollerer innlogging …';
      try {
        const state = await api('/auth/session');
        if (id !== loadId) return;
        if (!state.loggedIn) return startCodeLogin(id);
        const favorites = await api('/favorites');
        if (id !== loadId) return;
        select.replaceChildren(new Option('Velg server …', ''));
        favorites.forEach((favorite) => select.add(new Option(favorite.name, favorite.id)));
        if (savedServerId && ![...select.options].some((option) => option.value === savedServerId)) {
          select.add(new Option(savedServerId, savedServerId));
        }
        select.value = savedServerId;
        hint.textContent = favorites.length
          ? `Logget inn som ${state.user?.displayName || state.user?.username || 'bruker'}. Velg en favorittserver.`
          : 'Ingen favoritter funnet. Lagre servere i launcheren.';
      } catch {
        if (id === loadId) failed('Start FiveM Norge Launcher og trykk «Last inn på nytt».');
      }
    }

    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
      const details = JSON.parse(actionInfo);
      context = details.context;
      action = details.action;
      savedServerId = details.payload?.settings?.serverId || '';
      ws = new WebSocket(`ws://127.0.0.1:${port}`);
      ws.onopen = () => {
        ws.send(JSON.stringify({ event: registerEvent, uuid }));
        loadFavorites();
      };
    };
  </script>
</body>
</html>
