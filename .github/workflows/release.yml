# Bygger launcheren for Windows og legger exe-filene i exe/ (med exe/latest.json).
# Launcherne til brukerne leser exe/latest.json og oppdaterer seg selv.
#
# Start: Actions → «Bygg exe» → Run workflow (øk "version" i package.json først).
# Eller lokalt: bygg, kjør «npm run exe -- "hva er nytt"», commit og push.

name: Bygg exe

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Hva er nytt i denne versjonen
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Lag .env
        shell: bash
        run: |
          echo "DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID || '833800432866295868' }}" > .env
          echo "UPDATE_REPO=${{ github.repository }}" >> .env
          echo "BACKEND_URL=${{ vars.BACKEND_URL || 'https://fivemnorge.xyz' }}" >> .env

      - name: Bygg
        run: npx vite build && npx electron-builder --win --x64 --publish never

      - name: Legg i exe/ og push
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          node scripts/publish-exe.cjs "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exe
          git commit -m "exe: $(node -p "require('./package.json').version")" || echo "Ingen endringer"
          git push
